<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Scoreboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="scoreboard" data-phase="waiting">
  <!-- gambar ikon serangan (dipakai lewat <use>) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <!-- headguard: kubah, telinga, bukaan wajah -->
      <path id="s-head" d="M32 5 C22 5 16 10 15 19 L14 31 L18 47 Q22 56 28 58 L36 58 Q42 56 46 47 L50 31 L49 19 C48 10 42 5 32 5 Z"/>
      <path id="s-earL" d="M12 29 Q8 30 8 35 L11 45 Q12 47 15 46 L16 31 Z"/>
      <path id="s-earR" d="M52 29 Q56 30 56 35 L53 45 Q52 47 49 46 L48 31 Z"/>
      <g id="ic-head" stroke-linejoin="round" stroke-linecap="round">
        <g fill="#fff" stroke="#fff" stroke-width="5">
          <use href="#s-head"/><use href="#s-earL"/><use href="#s-earR"/>
        </g>
        <g fill="currentColor">
          <use href="#s-head"/><use href="#s-earL"/><use href="#s-earR"/>
        </g>
        <g fill="#fff">
          <path d="M23 13 Q32 9.5 41 13 L39.5 15 Q32 12.5 24.5 15 Z"/>
          <ellipse cx="22" cy="23" rx="2.6" ry="3.6"/>
          <ellipse cx="42" cy="23" rx="2.6" ry="3.6"/>
          <path d="M23 31 Q23 29 26 29 L38 29 Q41 29 41 31 Q41 41 36 47 L33.5 50 Q32 51.5 30.5 50 L28 47 Q23 41 23 31 Z"/>
        </g>
        <path d="M16.5 31 L17.5 46 M47.5 31 L46.5 46" fill="none" stroke="#fff" stroke-width="1.6"/>
      </g>

      <!-- body protector: sayap bahu, kerah, pita horizontal -->
      <path id="s-trunk" d="M5 17 Q4 13.5 8 12.5 L21 10 Q23 21 32 21 Q41 21 43 10 L56 12.5 Q60 13.5 59 17 Q58 21 54 23.5 Q51.5 26 53 30 Q54.5 34 54 36 L52 50 Q51.5 56 45.5 56 L18.5 56 Q12.5 56 12 50 L10 36 Q9.5 34 11 30 Q12.5 26 10 23.5 Q6 21 5 17 Z"/>
      <g id="ic-trunk" stroke-linejoin="round" stroke-linecap="round">
        <use href="#s-trunk" fill="#fff" stroke="#fff" stroke-width="5"/>
        <use href="#s-trunk" fill="currentColor"/>
        <path d="M25 13 Q32 24 39 13 L38 22 Q32 27 26 22 Z" fill="currentColor" stroke="#fff" stroke-width="1.6"/>
        <g fill="none" stroke="#fff" stroke-width="2">
          <path d="M10.5 33 Q32 36 53.5 33"/>
          <path d="M11.5 43 Q32 46 52.5 43"/>
          <path d="M17 52 Q32 46 47 52"/>
        </g>
      </g>

      <!-- kepalan: 4 jari dipisah garis putih, ibu jari melintang -->
      <g id="s-fist">
        <rect x="9.5" y="15" width="10.2" height="19" rx="5"/>
        <rect x="21.1" y="8" width="10.2" height="26" rx="5.1"/>
        <rect x="32.7" y="8" width="10.2" height="26" rx="5.1"/>
        <rect x="44.3" y="15" width="10.2" height="19" rx="5"/>
        <path d="M9.5 28 L54.5 28 L55 42 Q55 47 50 51.5 L47 55 L47 59 Q47 60.5 45.5 60.5 L22 60.5 Q20.5 60.5 20.5 59 L20.5 53 Q9.5 46 9.5 36 Z"/>
      </g>
      <g id="ic-fist" stroke-linejoin="round" stroke-linecap="round">
        <use href="#s-fist" fill="#fff" stroke="#fff" stroke-width="5"/>
        <use href="#s-fist" fill="currentColor"/>
        <rect x="32" y="34" width="23" height="11" rx="5.5" fill="currentColor" stroke="#fff" stroke-width="1.8"/>
      </g>
    </defs>
  </svg>
  <div class="category">
    <div id="eventName" class="event-name"></div>
    <div id="category"></div>
  </div>

  <div class="main">
    <div class="side chung">
      <div class="hits" id="chungHits"></div>
      <div>
        <div class="name" id="chungName"></div>
        <div class="country" id="chungCountry"></div>
      </div>
      <div class="score" id="chungScore">0</div>
      <div class="foot">
        <div class="gj">GAM-JEOM <b id="chungGj">0</b></div>
        <div class="cam" id="chungCam">🎥</div>
        <div class="dots" id="chungDots"></div>
      </div>
    </div>

    <div class="center">
      <div class="label" id="label"></div>
      <div class="timer" id="timer">2:00</div>
      <div class="round">ROUND <b id="round">1</b></div>
    </div>

    <div class="side hong">
      <div class="hits" id="hongHits"></div>
      <div>
        <div class="name" id="hongName"></div>
        <div class="country" id="hongCountry"></div>
      </div>
      <div class="score" id="hongScore">0</div>
      <div class="foot">
        <div class="gj">GAM-JEOM <b id="hongGj">0</b></div>
        <div class="cam" id="hongCam">🎥</div>
        <div class="dots" id="hongDots"></div>
      </div>
    </div>
  </div>

  <div id="overlay" class="overlay hidden"></div>

  <script>
    const { ipcRenderer } = require('electron');
    const $ = (id) => document.getElementById(id);
    const fmt = (s) => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
    let last = null;
    let sync = null;

    // Timer: di bawah 10 detik tampil desimal (mis. 9.87) dan berjalan halus
    function showTimer() {
      if (!sync) return;
      const st = sync.st;
      let txt;
      if (st.phase === 'kyeshi') {
        txt = fmt(st.injuryTime);
      } else {
        let rem = st.timeLeft + (st.tenths || 0) / 10;
        const live = st.phase === 'running' || st.phase === 'paused';
        if (live && rem < 10) {
          if (st.phase === 'running') {
            const el = (performance.now() - sync.at) / 1000;
            rem = Math.max(0, rem - Math.min(el, 0.1));
          }
          txt = rem.toFixed(2);
        } else {
          txt = fmt(st.timeLeft);
        }
      }
      $('timer').textContent = txt;
    }
    (function loop() { showTimer(); requestAnimationFrame(loop); })();

    const sideTxt = (s) => (s === 'chung'
      ? '<span class="c-blue">BLUE</span>'
      : '<span class="c-red">RED</span>');

    function ivrTitle(kind, by) {
      if (kind === 'coach') return `VIDEO REPLAY ${sideTxt(by)}`;
      if (kind === 'technical') return 'TECHNICAL CARD';
      return 'VIDEO REPLAY';
    }

    // ikon serangan yang masuk (ronde berjalan); kuning = teknik putar (4 dan 6 poin)
    const HIT_ICON = { punch: 'fist', trunk: 'trunk', 'trunk-turn': 'trunk', head: 'head', 'head-turn': 'head' };
    const seenHits = new Set();
    const seenHi = new Set(); // ikon yang sudah pernah tampil menyala
    const hitSig = { chung: '', hong: '' };

    ipcRenderer.on('whistle', playWhistle);

    function renderHits(st, s) {
      // saat layar IVR / hasil IVR tampil, tunda pembaruan ikon agar animasinya terlihat setelah layar itu hilang
      if (st.phase === 'ivr' || st.ivrResult) return;
      if (!st.events.length) { seenHits.clear(); seenHi.clear(); }
      // tendangan dasar yang sudah mendapat poin teknikal ikut menyala, sama seperti tendangan putar dari joystick
      const linked = new Set(st.events.filter((e) => e.base).map((e) => e.base));
      const hits = st.events
        .filter((e) => e.kind === 'score' && e.side === s && e.round === st.round && HIT_ICON[e.tech])
        .slice(-14);
      const isHi = (e) => e.tech.endsWith('-turn') || linked.has(e.id);
      const sig = st.round + ':' + hits.map((e) => e.id + (isHi(e) ? '*' : '')).join(',');
      if (sig === hitSig[s]) return; // tidak berubah -> jangan gambar ulang (animasi tidak terulang)
      hitSig[s] = sig;
      $(s + 'Hits').innerHTML = hits.map((e) => {
        const hi = isHi(e);
        const fresh = !seenHits.has(e.id) || (hi && !seenHi.has(e.id)); // baru masuk, atau baru menyala
        const cls = 'hit t-' + HIT_ICON[e.tech] + (hi ? ' hi' : '') + (fresh ? ' new' : '');
        return `<svg class="${cls}" viewBox="0 0 64 64"><use href="#ic-${HIT_ICON[e.tech]}"/></svg>`;
      }).join('');
      hits.forEach((e) => {
        seenHits.add(e.id);
        if (isHi(e)) seenHi.add(e.id); else seenHi.delete(e.id);
      });
    }

    // ===== SUARA (dibuat dengan Web Audio, tanpa file) =====
    const SOUND_VOLUME = 0.8; // 0 sampai 1
    let actx = null;
    function audio() {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
      return actx;
    }

    // Peluit wasit: dua nada tinggi bergetar + desis napas
    function playWhistle() {
      const ac = audio();
      const t0 = ac.currentTime;
      const dur = 0.7;
      const master = ac.createGain();
      master.gain.setValueAtTime(0.0001, t0);
      master.gain.exponentialRampToValueAtTime(0.3 * SOUND_VOLUME, t0 + 0.03);
      master.gain.setValueAtTime(0.3 * SOUND_VOLUME, t0 + dur - 0.12);
      master.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      master.connect(ac.destination);

      for (const f of [2850, 3000]) {
        const o = ac.createOscillator();
        o.type = 'sine';
        o.frequency.value = f;
        const lfo = ac.createOscillator(); // getaran cepat seperti bola di dalam peluit
        lfo.frequency.value = 32;
        const lg = ac.createGain();
        lg.gain.value = 110;
        lfo.connect(lg);
        lg.connect(o.frequency);
        o.connect(master);
        o.start(t0);
        lfo.start(t0);
        o.stop(t0 + dur);
        lfo.stop(t0 + dur);
      }

      const nb = ac.createBuffer(1, Math.floor(ac.sampleRate * dur), ac.sampleRate);
      const d = nb.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      const ns = ac.createBufferSource();
      ns.buffer = nb;
      const bp = ac.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.value = 3200;
      bp.Q.value = 2;
      const ng = ac.createGain();
      ng.gain.value = 0.15;
      ns.connect(bp);
      bp.connect(ng);
      ng.connect(master);
      ns.start(t0);
    }

    // Bel: pukulan logam dengan nada sisa yang tidak harmonis
    // decay = lama gema (detik). Bel ronde habis 2.2, bel hitung mundur istirahat 0.8
    function playBell(decay) {
      const ac = audio();
      const t0 = ac.currentTime;
      const base = 1050;
      const master = ac.createGain();
      master.gain.value = 0.3 * SOUND_VOLUME;
      master.connect(ac.destination);
      const partials = [[1, 1], [2.0, 0.6], [2.76, 0.5], [5.4, 0.25], [8.93, 0.12]];
      for (const [ratio, amp] of partials) {
        const o = ac.createOscillator();
        o.type = 'sine';
        o.frequency.value = base * ratio;
        const g = ac.createGain();
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(amp, t0 + 0.004);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + decay / Math.sqrt(ratio));
        o.connect(g);
        g.connect(master);
        o.start(t0);
        o.stop(t0 + decay + 0.1);
      }
    }

    // pendeteksi kejadian suara: bandingkan state lama dan baru
    function handleSounds(prev, st) {
      if (!prev) return;
      // 1. peluit saat timer ronde masuk di bawah 10 detik
      if (prev.phase === 'running' && st.phase === 'running' && st.round === prev.round &&
          prev.timeLeft >= 10 && st.timeLeft < 10) playWhistle();
      // 2. bel saat waktu ronde habis
      if (prev.phase === 'running' && st.phase === 'timeUp') playBell(2.2);
      // 3. bel tiap detik di 5 detik terakhir waktu istirahat
      if (st.phase === 'rest' && st.timeLeft >= 1 && st.timeLeft <= 5 &&
          (prev.phase !== 'rest' || prev.timeLeft !== st.timeLeft)) playBell(0.8);
    }

    // tabel skor per ronde untuk layar pemenang
    function scoreTable(st) {
      const rows = [];
      for (let r = 0; r < st.round; r++) {
        const cp = st.points.chung[r];
        const hp = st.points.hong[r];
        const rw = st.roundWinner[r];
        if (!rw && cp + hp === 0) continue; // ronde yang tidak dimainkan
        rows.push(
          `<tr><td class="rl">R${r + 1}</td>` +
          `<td class="sc chung ${rw === 'chung' ? 'win' : ''}">${cp}</td>` +
          `<td class="sc hong ${rw === 'hong' ? 'win' : ''}">${hp}</td></tr>`
        );
      }
      if (!rows.length) return '';
      return `<table class="res-table">` +
        `<tr><th></th><th>${st.chung.country}</th><th>${st.hong.country}</th></tr>` +
        rows.join('') + `</table>`;
    }

    function render(st) {
      handleSounds(last, st);
      last = st;
      const i = st.round - 1;
      document.body.dataset.phase = st.phase;
      document.body.classList.toggle('rev', !!(st.settings && st.settings.reversed));
      $('eventName').textContent = (st.settings && st.settings.eventName) || '';
      $('category').textContent = st.category;

      for (const s of ['chung', 'hong']) {
        $(s + 'Name').textContent = st[s].name;
        $(s + 'Country').textContent = st[s].country;
        $(s + 'Score').textContent = st.points[s][i];
        $(s + 'Gj').textContent = st.gamjeom[s][i];
        const w = st.roundWinner.filter((x) => x === s).length;
        $(s + 'Dots').innerHTML = [0, 1]
          .map((n) => `<span class="dot ${n < w ? 'on' : ''}"></span>`)
          .join('');
        $(s + 'Cam').style.opacity = st.ivr && st.ivr[s] > 0 ? 1 : 0.2;
        renderHits(st, s);
      }

      sync = { st, at: performance.now() };
      showTimer();
      $('round').textContent = st.round;

      const labels = {
        waiting: 'MATCH ' + st.matchNo,
        running: 'MATCH ' + st.matchNo,
        paused: 'KAL-YEO',
        timeUp: 'TIME UP',
        roundEnd: 'ROUND END',
        rest: 'BREAK TIME',
        tie: 'TIEBREAKER',
        kyeshi: 'KYESHI',
        ivr: st.ivrKind === 'technical' ? 'TECHNICAL CARD' : 'VIDEO REPLAY',
        test: 'TEST MODE',
        ended: 'MATCH ' + st.matchNo,
      };
      $('label').textContent = labels[st.phase];

      const ov = $('overlay');

      if (st.phase === 'ended') {
        const w = st[st.winner];
        const rc = st.roundWinner.filter((x) => x === 'chung').length;
        const rh = st.roundWinner.filter((x) => x === 'hong').length;
        if (st.resultStage === 'bow') {
          ov.className = 'overlay';
          ov.innerHTML =
            `<div class="ov-title">MATCH ${st.matchNo}</div>` +
            `<div class="bow">CHA-RYEOT</div>` +
            `<div class="bow">KYEONG-RYE</div>`;
        } else {
          const code = st.resultCode;
          const cname = (st.meta && st.meta.result && st.meta.result[code]) || '';
          ov.className = 'overlay ' + st.winner;
          ov.innerHTML =
            `<div class="ov-title">MATCH ${st.matchNo} RESULT</div>` +
            `<div class="ov-win">WINNER</div>` +
            `<div class="ov-name">${w.name} (${w.country})</div>` +
            (code ? `<div class="ov-code">${cname} (${code})</div>` : '') +
            scoreTable(st) +
            (rc + rh > 0 ? `<div class="ov-rounds">ROUNDS ${rc} – ${rh}</div>` : '');
        }
      } else if (st.phase === 'roundEnd') {
        const w = st.roundWinner[i];
        const p = st[w];
        ov.className = 'overlay ' + w;
        ov.innerHTML =
          `<div class="ov-title">ROUND ${st.round} WINNER</div>` +
          `<div class="ov-name">${p.name} (${p.country})</div>` +
          `<div class="rw-score">${st.points.chung[i]} – ${st.points.hong[i]}</div>`;
      } else if (st.phase === 'tie' && st.tie.stage === 'summary') {
        // tabel ringkasan tiebreaker, tampil 2 detik
        const t = st.tie;
        const rows = t.steps.map((s, n) => {
          const cw = t.decided === n && s.chung > s.hong;
          const hw = t.decided === n && s.hong > s.chung;
          const dim = t.decided >= 0 && n > t.decided;
          return `<tr class="${dim ? 'dim' : ''}"><td class="crit">${s.title}</td>` +
            `<td class="n chung ${cw ? 'win' : ''}">${s.chung}</td>` +
            `<td class="n hong ${hw ? 'win' : ''}">${s.hong}</td></tr>`;
        }).join('');
        ov.className = 'overlay';
        ov.innerHTML = `<div class="tb-title">TIEBREAKER</div><table class="tb-table">${rows}</table>`;
      } else if (st.phase === 'tie' && st.tie.stage === 'vote') {
        ov.className = 'overlay';
        ov.innerHTML =
          `<div class="tb-title">WOO-SE-GIROK</div>` +
          `<div class="tb-votes">` +
            st.tie.votes.map((v) => `<span class="vote ${v || 'none'}"></span>`).join('') +
          `</div>`;
      } else if (st.phase === 'ivr') {
        ov.className = 'overlay';
        ov.innerHTML =
          `<div class="ov-ivr">${ivrTitle(st.ivrKind, st.ivrBy)}</div>` +
          `<div class="ov-cam">${st.ivrKind === 'technical' ? '🟩' : '🎥'}</div>` +
          (st.ivrKind === 'referee' ? `<div class="ov-sub">REQUEST BY REFEREE</div>` : '');
      } else if (st.ivrResult) {
        const r = st.ivrResult;
        const ok = r.result === 'accept';
        ov.className = 'overlay';
        ov.innerHTML =
          `<div class="ov-ivr">${ivrTitle(r.kind, r.by)}</div>` +
          `<div class="ov-mark ${ok ? 'ok' : 'no'}">${ok ? '○' : '✕'}</div>` +
          `<div class="ov-ivr">${ok ? 'ACCEPTED' : 'REJECTED'}</div>`;
      } else {
        ov.className = 'overlay hidden';
      }
    }

    ipcRenderer.invoke('getState').then(render);
    ipcRenderer.on('state', (e, st) => render(st));

    // ===== TOMBOL TES (di jendela scoreboard) =====
    const send = (type, payload) => ipcRenderer.send('cmd', type, payload);
    // scoreboard hanya punya pintasan tampilan; kontrol pertandingan hanya lewat jendela operator
    const keys = {
      ' ': () => send(last && last.phase === 'running' ? 'pause' : 'start'),
      f: () => ipcRenderer.send('fullscreen'),
      1: () => playWhistle(),
      2: () => playBell(2.2),
      3: () => playBell(0.8),
    };
    document.addEventListener('keydown', (e) => {
      const fn = keys[e.key.toLowerCase()];
      if (fn) { e.preventDefault(); fn(); }
    });
  </script>
</body>
</html>

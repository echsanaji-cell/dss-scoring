<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Scoreboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="scoreboard" data-phase="waiting">
  <div class="category" id="category"></div>

  <div class="main">
    <div class="side chung">
      <div>
        <div class="name" id="chungName"></div>
        <div class="country" id="chungCountry"></div>
      </div>
      <div class="score" id="chungScore">0</div>
      <div class="foot">
        <div class="gj">GAM-JEOM <b id="chungGj">0</b></div>
        <div class="cam" id="chungCam">🎥</div>
        <div class="dots" id="chungDots"></div>
      </div>
    </div>

    <div class="center">
      <div class="label" id="label"></div>
      <div class="timer" id="timer">2:00</div>
      <div class="round">ROUND <b id="round">1</b></div>
    </div>

    <div class="side hong">
      <div>
        <div class="name" id="hongName"></div>
        <div class="country" id="hongCountry"></div>
      </div>
      <div class="score" id="hongScore">0</div>
      <div class="foot">
        <div class="gj">GAM-JEOM <b id="hongGj">0</b></div>
        <div class="cam" id="hongCam">🎥</div>
        <div class="dots" id="hongDots"></div>
      </div>
    </div>
  </div>

  <div id="overlay" class="overlay hidden"></div>

  <script>
    const { ipcRenderer } = require('electron');
    const $ = (id) => document.getElementById(id);
    const fmt = (s) => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
    let last = null;
    let sync = null;

    // Timer: di bawah 10 detik tampil desimal (mis. 9.87) dan berjalan halus
    function showTimer() {
      if (!sync) return;
      const st = sync.st;
      let txt;
      if (st.phase === 'kyeshi') {
        txt = fmt(st.injuryTime);
      } else {
        let rem = st.timeLeft + (st.tenths || 0) / 10;
        const live = st.phase === 'running' || st.phase === 'paused';
        if (live && rem < 10) {
          if (st.phase === 'running') {
            const el = (performance.now() - sync.at) / 1000;
            rem = Math.max(0, rem - Math.min(el, 0.1));
          }
          txt = rem.toFixed(2);
        } else {
          txt = fmt(st.timeLeft);
        }
      }
      $('timer').textContent = txt;
    }
    (function loop() { showTimer(); requestAnimationFrame(loop); })();

    const sideTxt = (s) => (s === 'chung'
      ? '<span class="c-blue">BLUE</span>'
      : '<span class="c-red">RED</span>');

    function ivrTitle(kind, by) {
      if (kind === 'coach') return `VIDEO REPLAY ${sideTxt(by)}`;
      if (kind === 'technical') return 'TECHNICAL CARD';
      return 'VIDEO REPLAY';
    }

    function render(st) {
      last = st;
      const i = st.round - 1;
      document.body.dataset.phase = st.phase;
      $('category').textContent = st.category;

      for (const s of ['chung', 'hong']) {
        $(s + 'Name').textContent = st[s].name;
        $(s + 'Country').textContent = st[s].country;
        $(s + 'Score').textContent = st.points[s][i];
        $(s + 'Gj').textContent = st.gamjeom[s][i];
        const w = st.roundWinner.filter((x) => x === s).length;
        $(s + 'Dots').innerHTML = [0, 1]
          .map((n) => `<span class="dot ${n < w ? 'on' : ''}"></span>`)
          .join('');
        $(s + 'Cam').style.opacity = st.ivr && st.ivr[s] > 0 ? 1 : 0.2;
      }

      sync = { st, at: performance.now() };
      showTimer();
      $('round').textContent = st.round;

      const labels = {
        waiting: 'MATCH ' + st.matchNo,
        running: 'MATCH ' + st.matchNo,
        paused: 'KAL-YEO',
        roundEnd: 'ROUND END',
        rest: 'BREAK TIME',
        tie: 'TIEBREAKER',
        kyeshi: 'KYESHI',
        ivr: st.ivrKind === 'technical' ? 'TECHNICAL CARD' : 'VIDEO REPLAY',
        test: 'TEST MODE',
        ended: 'MATCH ' + st.matchNo,
      };
      $('label').textContent = labels[st.phase];

      const ov = $('overlay');

      if (st.phase === 'ended') {
        const w = st[st.winner];
        ov.className = 'overlay ' + st.winner;
        ov.innerHTML =
          `<div class="ov-title">MATCH ${st.matchNo} RESULT</div>` +
          `<div class="ov-win">WINNER</div>` +
          `<div class="ov-name">${w.name} (${w.country})</div>`;
      } else if (st.phase === 'roundEnd') {
        const w = st.roundWinner[i];
        const p = st[w];
        ov.className = 'overlay ' + w;
        ov.innerHTML =
          `<div class="ov-title">ROUND ${st.round} WINNER</div>` +
          `<div class="ov-name">${p.name} (${p.country})</div>` +
          `<div class="rw-score">${st.points.chung[i]} – ${st.points.hong[i]}</div>`;
      } else if (st.phase === 'test') {
        ov.className = 'overlay';
        ov.innerHTML = `<div class="ov-test">TEST MODE</div>`;
      } else if (st.phase === 'tie' && st.tie.stage === 'summary') {
        // tabel ringkasan tiebreaker, tampil 2 detik
        const t = st.tie;
        const rows = t.steps.map((s, n) => {
          const cw = t.decided === n && s.chung > s.hong;
          const hw = t.decided === n && s.hong > s.chung;
          const dim = t.decided >= 0 && n > t.decided;
          return `<tr class="${dim ? 'dim' : ''}"><td class="crit">${s.title}</td>` +
            `<td class="n chung ${cw ? 'win' : ''}">${s.chung}</td>` +
            `<td class="n hong ${hw ? 'win' : ''}">${s.hong}</td></tr>`;
        }).join('');
        ov.className = 'overlay';
        ov.innerHTML = `<div class="tb-title">TIEBREAKER</div><table class="tb-table">${rows}</table>`;
      } else if (st.phase === 'tie' && st.tie.stage === 'vote') {
        ov.className = 'overlay';
        ov.innerHTML =
          `<div class="tb-title">WOO-SE-GIROK</div>` +
          `<div class="tb-votes">` +
            st.tie.votes.map((v) => `<span class="vote ${v || 'none'}"></span>`).join('') +
          `</div>`;
      } else if (st.phase === 'ivr') {
        ov.className = 'overlay';
        ov.innerHTML =
          `<div class="ov-ivr">${ivrTitle(st.ivrKind, st.ivrBy)}</div>` +
          `<div class="ov-cam">${st.ivrKind === 'technical' ? '🟩' : '🎥'}</div>` +
          (st.ivrKind === 'referee' ? `<div class="ov-sub">REQUEST BY REFEREE</div>` : '');
      } else if (st.ivrResult) {
        const r = st.ivrResult;
        const ok = r.result === 'accept';
        ov.className = 'overlay';
        ov.innerHTML =
          `<div class="ov-ivr">${ivrTitle(r.kind, r.by)}</div>` +
          `<div class="ov-mark ${ok ? 'ok' : 'no'}">${ok ? '○' : '✕'}</div>` +
          `<div class="ov-ivr">${ok ? 'ACCEPTED' : 'REJECTED'}</div>`;
      } else {
        ov.className = 'overlay hidden';
      }
    }

    ipcRenderer.invoke('getState').then(render);
    ipcRenderer.on('state', (e, st) => render(st));

    // ===== TOMBOL TES (di jendela scoreboard) =====
    const send = (type, payload) => ipcRenderer.send('cmd', type, payload);
    const keys = {
      q: () => send('score', { side: 'chung', tech: 'punch' }),
      a: () => send('score', { side: 'chung', tech: 'trunk' }),
      z: () => send('score', { side: 'chung', tech: 'head' }),
      w: () => send('gj', { side: 'chung', reason: 'umum' }),
      p: () => send('score', { side: 'hong', tech: 'punch' }),
      k: () => send('score', { side: 'hong', tech: 'trunk' }),
      m: () => send('score', { side: 'hong', tech: 'head' }),
      o: () => send('gj', { side: 'hong', reason: 'umum' }),
      ' ': () => send(last && last.phase === 'running' ? 'pause' : 'start'),
      n: () => send('newMatch'),
      f: () => ipcRenderer.send('fullscreen'),
    };
    document.addEventListener('keydown', (e) => {
      const fn = keys[e.key.toLowerCase()];
      if (fn) { e.preventDefault(); fn(); }
    });
  </script>
</body>
</html>

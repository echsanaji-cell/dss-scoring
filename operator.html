<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Operator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="operator" data-phase="waiting">

  <!-- Info pertandingan -->
  <div class="op-top">
    <input id="category" placeholder="Kategori (mis. Male -58 kg)">
    <input id="matchNo" class="short" placeholder="No">
    <div class="op-status">
      <span id="phase"></span>
      <span id="round"></span>
      <span class="op-timer" id="timer">2:00</span>
    </div>
  </div>

  <!-- Dua sisi: dibuat lewat JS di bawah -->
  <div class="op-main" id="sides"></div>

  <!-- Tiebreaker -->
  <div class="tie">
    <div class="tie-head">⚖ SKOR SERI: TIEBREAKER</div>
    <div id="tieInfo"></div>
    <div id="votes"></div>
  </div>

  <!-- Panel Kyeshi / cedera -->
  <div class="inj">
    <span>Kyeshi berjalan. Atlet bisa lanjut, atau tetapkan pemenang jika tidak bisa lanjut:</span>
    <button id="btnResume" class="b-start">LANJUTKAN</button>
    <button class="b-chung" data-injwin="chung">CHUNG MENANG</button>
    <button class="b-hong" data-injwin="hong">HONG MENANG</button>
  </div>

  <!-- Panel IVR / Kartu Teknis -->
  <div class="ivr">
    <div class="ivr-head" id="ivrHead"></div>
    <div class="ivr-row" id="ivrReq">
      <span>Pemohon</span>
      <button class="b-chung" data-req="chung">COACH CHUNG</button>
      <button class="b-hong" data-req="hong">COACH HONG</button>
      <button data-req="wasit">WASIT</button>
    </div>
    <div class="ivr-row"><span>Alasan</span><select id="ivrReason"></select></div>
    <div class="ivr-row">
      <span>Atlet</span>
      <button class="b-chung" data-ivrp="chung">CHUNG</button>
      <button class="b-hong" data-ivrp="hong">HONG</button>
      <small class="muted">Untuk Gam-jeom: pilih atlet yang DIKENAI Gam-jeom</small>
    </div>
    <div class="ivr-row">
      <span>Jenis</span>
      <button data-ivrk="gj">Gam-jeom</button>
      <button data-ivrk="punch">1 Pukulan</button>
      <button data-ivrk="trunk">2 Badan</button>
      <button data-ivrk="head">3 Kepala</button>
      <button data-ivrk="trunk-turn">4 Putar badan</button>
      <button data-ivrk="head-turn">6 Putar kepala</button>
    </div>
    <div class="ivr-row">
      <span>Aksi</span>
      <button data-ivra="1">TAMBAH [+]</button>
      <button data-ivra="-1">KURANGI [−]</button>
      <button id="btnAddAdj">➕ Masukkan ke daftar koreksi</button>
    </div>
    <div class="ivr-sel" id="ivrSel"></div>
    <div class="ivr-list" id="ivrList"></div>
    <div class="ivr-row">
      <button class="b-start" id="btnAccept">ACCEPT [O]</button>
      <button class="b-reject" id="btnReject">REJECT [X]</button>
      <button id="btnIvrCancel">Batal (salah tekan)</button>
    </div>
  </div>

  <!-- Kontrol -->
  <div class="op-controls">
    <button class="b-start" id="btnStart">▶ Shijak / Kye-sok</button>
    <button class="b-pause" id="btnPause">⏸ Kal-yeo</button>
    <button class="b-undo" id="btnUndo">↩ Undo</button>
    <button class="b-test" id="btnTest">🧪 Test</button>
    <button class="b-kye" id="btnKyeshi">⏱ Kyeshi (Dokter)</button>
  </div>
  <div class="op-controls">
    <button class="b-ref" id="btnIvrRef">🎥 IVR Wasit</button>
    <button class="b-tech" id="btnTech">🟩 Kartu Teknis</button>
    <button class="b-set" id="btnSet">⚙ Pengaturan</button>
    <button class="b-new" id="btnNew">Match Baru</button>
  </div>

  <!-- Koreksi waktu -->
  <div class="op-time">
    <span>Koreksi waktu (saat Kal-yeo):</span>
    <input id="tMin" type="number" min="0" max="99"> :
    <input id="tSec" type="number" min="0" max="59">
    <button id="btnSetTime">Set waktu</button>
  </div>

  <!-- Pengaturan -->
  <div class="op-settings hidden" id="settings">
    <label>Waktu ronde (detik) <input id="sRound" type="number" min="10"></label>
    <label>Istirahat (detik) <input id="sRest" type="number" min="0"></label>
    <label>Batas Gam-jeom / ronde <input id="sGj" type="number" min="1"></label>
    <label><input id="sGapOn" type="checkbox"> Point gap aktif</label>
    <label>Selisih point gap <input id="sGap" type="number" min="1"></label>
    <label>Kuota IVR / pertandingan <input id="sIvr" type="number" min="0"></label>
    <label>Jumlah juri
      <select id="sJudge"><option value="1">1</option><option value="2">2</option><option value="3">3</option></select>
    </label>
  </div>

  <!-- Rekap ronde -->
  <table class="op-table" id="recap"></table>

  <script>
    const { ipcRenderer } = require('electron');
    const $ = (id) => document.getElementById(id);
    const send = (type, payload) => ipcRenderer.send('cmd', type, payload);
    const fmt = (s) => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');

    const TECHS = [['punch', 1, 'Pukulan'], ['trunk', 2, 'Badan'], ['head', 3, 'Kepala'], ['trunk-turn', 4, 'Putar badan'], ['head-turn', 6, 'Putar kepala']];
    const TECH_NAME = Object.fromEntries(TECHS.map(([k, , t]) => [k, t]));
    const SIDE = { chung: 'CHUNG', hong: 'HONG', wasit: 'WASIT' };
    const IVR_NAME = { coach: 'IVR Coach', referee: 'IVR Wasit', technical: 'Kartu Teknis' };
    const voterNames = (n) => (n === 3 ? ['Judge 1', 'Judge 2', 'Judge 3']
      : n === 2 ? ['Center Referee', 'Judge 1', 'Judge 2']
      : ['Center Referee', 'Judge', 'Review Jury']);

    let last = null;
    let gjFilled = false;
    let lastTimeKey = '';
    let lastIvrKind = null;
    let ivrReq = 'wasit';
    let adj = { side: null, kind: null, sign: 1 };
    let adjs = [];

    // ----- bangun tampilan dua sisi -----
    function sideHTML(s, label) {
      return `
      <div class="op-side ${s}">
        <div class="op-head">${label}</div>
        <div class="op-info">
          <input id="${s}Name" placeholder="Nama peserta">
          <input id="${s}Country" class="short" maxlength="3" placeholder="NEG">
        </div>
        <div class="op-score" id="${s}Score">0</div>
        <div class="op-pts">
          ${TECHS.map(([k, n, t]) => `<button data-side="${s}" data-tech="${k}">+${n}<small>${t}</small></button>`).join('')}
        </div>
        <div class="op-gjrow">
          <button class="op-gj" data-gj="${s}">GAM-JEOM <b id="${s}Gj">0</b></button>
          <button class="op-gj op-gjp" data-gjp="${s}">GJ PASIF <small id="${s}GjPts"></small></button>
        </div>
        <button class="op-ivrbtn" data-ivr="${s}">🎥 IVR Coach (sisa <b id="${s}Ivr">1</b>)</button>
        <div class="op-wins">Ronde menang: <b id="${s}Wins">0</b></div>
      </div>`;
    }
    $('sides').innerHTML = sideHTML('chung', 'CHUNG (BIRU)') + sideHTML('hong', 'HONG (MERAH)');

    function setVal(id, v) {
      const el = $(id);
      if (document.activeElement !== el) el.value = v; // jangan ganggu saat sedang mengetik
    }

    // ----- Gam-jeom pasif: Gam-jeom tetap 1, lawan mendapat 2 poin -----
    function showGjHint() {
      for (const s of ['chung', 'hong']) $(s + 'GjPts').textContent = '(lawan +2)';
    }

    // ----- IVR: pilihan koreksi -----
    function adjLabel(a) {
      return `${a.sign > 0 ? '+' : '−'} ${a.kind === 'gj' ? 'Gam-jeom' : TECH_NAME[a.kind]} → ${SIDE[a.side]}`;
    }
    function showIvrSel() {
      document.querySelectorAll('[data-ivrp]').forEach((b) => b.classList.toggle('sel', b.dataset.ivrp === adj.side));
      document.querySelectorAll('[data-ivrk]').forEach((b) => b.classList.toggle('sel', b.dataset.ivrk === adj.kind));
      document.querySelectorAll('[data-ivra]').forEach((b) => b.classList.toggle('sel', Number(b.dataset.ivra) === adj.sign));
      document.querySelectorAll('[data-req]').forEach((b) => b.classList.toggle('sel', b.dataset.req === ivrReq));
      $('ivrSel').textContent = adj.side && adj.kind
        ? 'Koreksi dipilih: ' + adjLabel(adj)
        : 'Pilih atlet, jenis, dan aksi untuk menambah koreksi (opsional)';
      $('ivrList').innerHTML = adjs.length
        ? adjs.map((a, n) => `<span class="chip">${adjLabel(a)} <button data-adjdel="${n}">✕</button></span>`).join('')
        : '<span class="muted">Belum ada koreksi di daftar</span>';
    }

    // ----- log kejadian -----
    function logHTML(st) {
      const canDel = ['running', 'paused', 'rest', 'tie'].includes(st.phase) ||
        (st.phase === 'ended' && st.endedBy === 'round');
      const gjName = (code) => (st.meta.gj.find((x) => x[0] === code) || [0, code])[1];
      const rows = st.events.slice().reverse().slice(0, 40).map((e) => {
        let txt = '';
        if (e.kind === 'score') txt = `${SIDE[e.side]}: ${TECH_NAME[e.tech]} +${e.pts}`;
        else if (e.kind === 'gj') txt = `${SIDE[e.side]} kena Gam-jeom (${gjName(e.reason)}), lawan +${e.pts}`;
        else if (e.kind === 'ivr') {
          txt = `${IVR_NAME[e.ivrKind]}${e.by ? ' ' + SIDE[e.by] : ''}: ${e.result === 'accept' ? 'ACCEPT' : 'REJECT'}${e.reason ? ' · ' + e.reason : ''}`;
        }
        const note = e.note ? ` <small>(${e.note})</small>` : '';
        const del = e.kind !== 'ivr' && e.round === st.round && canDel
          ? `<button class="x" data-del="${e.id}">✕</button>` : '';
        return `<tr class="${e.kind}"><td>R${e.round}</td><td>${fmt(e.t)}</td><td>${txt}${note}</td><td>${del}</td></tr>`;
      });
      return rows.length
        ? `<table><tr><th>Ronde</th><th>Waktu</th><th>Kejadian</th><th></th></tr>${rows.join('')}</table>`
        : '<div class="muted" style="padding:10px">Belum ada kejadian</div>';
    }

    // ----- tampilkan state -----
    function render(st) {
      last = st;
      const i = st.round - 1;
      const scoring = st.phase === 'running' || st.phase === 'paused';
      document.body.dataset.phase = st.phase;

      setVal('category', st.category);
      setVal('matchNo', st.matchNo);
      for (const s of ['chung', 'hong']) {
        setVal(s + 'Name', st[s].name);
        setVal(s + 'Country', st[s].country);
        $(s + 'Score').textContent = st.points[s][i];
        $(s + 'Gj').textContent = st.gamjeom[s][i];
        $(s + 'Wins').textContent = st.roundWinner.filter((x) => x === s).length;
        $(s + 'Ivr').textContent = st.ivr[s];
        document.querySelector(`[data-ivr="${s}"]`).disabled = !(st.ivr[s] > 0 && scoring);
      }
      $('btnIvrRef').disabled = !scoring;
      $('btnTech').disabled = !scoring;
      showGjHint();

      const names = {
        waiting: 'SIAP', running: 'BERJALAN', paused: 'KAL-YEO', rest: 'ISTIRAHAT',
        tie: 'TIEBREAKER', ended: 'SELESAI', test: 'TEST MODE', kyeshi: 'KYESHI', ivr: 'IVR / KARTU TEKNIS',
      };
      $('phase').textContent = names[st.phase];
      $('round').textContent = 'Ronde ' + st.round;
      $('timer').textContent = fmt(st.phase === 'kyeshi' ? st.injuryTime : st.timeLeft);

      // isi kotak koreksi waktu hanya saat fase/ronde berubah
      const tkey = st.phase + ':' + st.round;
      if (tkey !== lastTimeKey) {
        lastTimeKey = tkey;
        $('tMin').value = Math.floor(st.timeLeft / 60);
        $('tSec').value = String(st.timeLeft % 60).padStart(2, '0');
      }

      // panel IVR / kartu teknis
      if (st.phase !== 'ivr') {
        adj = { side: null, kind: null, sign: 1 };
        adjs = [];
        ivrReq = 'wasit';
        lastIvrKind = null;
      } else {
        $('ivrHead').textContent = `🎥 ${IVR_NAME[st.ivrKind]}${st.ivrBy ? ' – ' + SIDE[st.ivrBy] : ''}`;
        $('ivrReq').style.display = st.ivrKind === 'technical' ? 'flex' : 'none';
        if (st.ivrKind !== lastIvrKind) {
          lastIvrKind = st.ivrKind;
          $('ivrReason').innerHTML = st.meta.ivr[st.ivrKind].map((r) => `<option>${r}</option>`).join('');
        }
      }
      showIvrSel();

      // panel tiebreaker
      if (st.phase === 'tie') {
        const t = st.tie;
        if (t.stage === 'steps') {
          const s = t.steps[t.shown];
          $('tieInfo').textContent = `Menampilkan kriteria ${t.shown + 1}/${t.steps.length}: ${s.title} (Chung ${s.chung} – Hong ${s.hong})`;
          $('votes').innerHTML = '';
        } else {
          $('tieInfo').textContent = 'Semua kriteria sama. WOO-SE-GIROK: masukkan pilihan tiap pemberi suara (pemenang = 2 dari 3 suara).';
          $('votes').innerHTML = voterNames(st.settings.judgeCount).map((n, v) => `
            <div class="ivr-row"><span>${n}</span>
              <button class="b-chung ${t.votes[v] === 'chung' ? 'sel' : ''}" data-voter="${v}" data-vside="chung">CHUNG</button>
              <button class="b-hong ${t.votes[v] === 'hong' ? 'sel' : ''}" data-voter="${v}" data-vside="hong">HONG</button>
            </div>`).join('');
        }
      }

      // pengaturan
      const S = st.settings;
      setVal('sRound', S.roundTime);
      setVal('sRest', S.restTime);
      setVal('sGj', S.gamjeomLimit);
      setVal('sGap', S.pointGap);
      setVal('sIvr', S.ivrQuota);
      if (document.activeElement !== $('sGapOn')) $('sGapOn').checked = S.pointGapOn;
      if (document.activeElement !== $('sJudge')) $('sJudge').value = String(S.judgeCount);

      // log dan rekap
      let rows = '<tr><th>Ronde</th><th>Chung</th><th>GJ</th><th>Hong</th><th>GJ</th><th>Pemenang</th></tr>';
      for (let r = 0; r < 3; r++) {
        const w = st.roundWinner[r];
        rows += `<tr class="${r === i ? 'now' : ''}"><td>R${r + 1}</td>
          <td>${st.points.chung[r]}</td><td>${st.gamjeom.chung[r]}</td>
          <td>${st.points.hong[r]}</td><td>${st.gamjeom.hong[r]}</td>
          <td>${w ? w.toUpperCase() : '-'}</td></tr>`;
      }
      $('recap').innerHTML = rows;
    }

    ipcRenderer.invoke('getState').then(render);
    ipcRenderer.on('state', (e, st) => render(st));

    // ----- klik tombol -----
    document.addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      if (b.dataset.tech) send('score', { side: b.dataset.side, tech: b.dataset.tech });
      if (b.dataset.gj) send('gj', { side: b.dataset.gj, passive: false });
      if (b.dataset.gjp) send('gj', { side: b.dataset.gjp, passive: true });
      if (b.dataset.ivr) send('ivr', { kind: 'coach', side: b.dataset.ivr });
      if (b.dataset.ivrp) { adj.side = b.dataset.ivrp; showIvrSel(); }
      if (b.dataset.ivrk) { adj.kind = b.dataset.ivrk; showIvrSel(); }
      if (b.dataset.ivra) { adj.sign = Number(b.dataset.ivra); showIvrSel(); }
      if (b.dataset.req) { ivrReq = b.dataset.req; showIvrSel(); }
      if (b.dataset.adjdel) { adjs.splice(Number(b.dataset.adjdel), 1); showIvrSel(); }
      if (b.dataset.injwin) send('injuryWin', { side: b.dataset.injwin });
      if (b.dataset.voter) send('vote', { voter: Number(b.dataset.voter), side: b.dataset.vside });
      if (b.dataset.del) send('del', { id: Number(b.dataset.del) });
    });

    $('btnStart').onclick = () => send('start');
    $('btnPause').onclick = () => send('pause');
    $('btnUndo').onclick = () => send('undo');
    $('btnTest').onclick = () => send('test');
    $('btnKyeshi').onclick = () => send('kyeshi');
    $('btnResume').onclick = () => send('resume');
    $('btnIvrRef').onclick = () => send('ivr', { kind: 'referee' });
    $('btnTech').onclick = () => send('ivr', { kind: 'technical' });
    $('btnNew').onclick = () => { if (confirm('Mulai pertandingan baru? Skor sekarang akan dihapus.')) send('newMatch'); };
    $('btnSet').onclick = () => $('settings').classList.toggle('hidden');
    $('btnSetTime').onclick = () => send('setTime', {
      seconds: (Number($('tMin').value) || 0) * 60 + (Number($('tSec').value) || 0),
    });

    // ----- IVR: masukkan koreksi, accept, reject, batal -----
    $('btnAddAdj').onclick = () => {
      if (adj.side && adj.kind) {
        adjs.push({ ...adj });
        adj = { side: null, kind: null, sign: adj.sign };
        showIvrSel();
      }
    };
    function ivrDecide(result) {
      const list = adjs.slice();
      if (adj.side && adj.kind) list.push({ ...adj }); // koreksi yang sudah dipilih tapi belum dimasukkan
      send('ivrDecide', {
        result,
        reason: $('ivrReason').value,
        requester: ivrReq,
        adjs: result === 'accept' ? list : [],
      });
    }
    $('btnAccept').onclick = () => ivrDecide('accept');
    $('btnReject').onclick = () => ivrDecide('reject');
    $('btnIvrCancel').onclick = () => send('ivrCancel');

    // ----- simpan nama/kategori saat selesai diubah -----
    for (const id of ['category', 'matchNo', 'chungName', 'chungCountry', 'hongName', 'hongCountry']) {
      $(id).addEventListener('change', () => send('setInfo', {
        category: $('category').value, matchNo: $('matchNo').value,
        chungName: $('chungName').value, chungCountry: $('chungCountry').value.toUpperCase(),
        hongName: $('hongName').value, hongCountry: $('hongCountry').value.toUpperCase(),
      }));
    }

    // ----- pengaturan -----
    for (const id of ['sRound', 'sRest', 'sGj', 'sGapOn', 'sGap', 'sIvr', 'sJudge']) {
      $(id).addEventListener('change', () => {
        const q = parseInt($('sIvr').value, 10);
        send('setSettings', {
          roundTime: Math.max(10, Number($('sRound').value) || 120),
          restTime: Math.max(0, Number($('sRest').value) || 0),
          gamjeomLimit: Math.max(1, Number($('sGj').value) || 5),
          pointGapOn: $('sGapOn').checked,
          pointGap: Math.max(1, Number($('sGap').value) || 15),
          ivrQuota: Number.isNaN(q) ? 1 : Math.max(0, q),
          judgeCount: Number($('sJudge').value) || 1,
        });
      });
    }

    // spasi = start / pause
    document.addEventListener('keydown', (e) => {
      if (e.key === ' ' && !['INPUT', 'SELECT', 'TEXTAREA'].includes(e.target.tagName)) {
        e.preventDefault();
        send(last && last.phase === 'running' ? 'pause' : 'start');
      }
    });
  </script>
</body>
</html>
